name: Build Windows EXE

on:
  workflow_dispatch: 
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' 

jobs:
  build:
    runs-on: windows-latest
    permissions:      # <--- 新增这一行
      contents: write # <--- 新增这一行
    
    steps:
      - name: 1. Checkout code (拉取代码)
        uses: actions/checkout@v4

      - name: 2. Setup Flutter (配置Flutter环境)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Install dependencies (安装依赖)
        run: flutter pub get

      - name: 4. Build Windows Release (编译Windows版本)
        run: flutter build windows --release

      - name: 5. Upload Artifact (上传临时测试文件)
        uses: actions/upload-artifact@v4
        with:
          name: ClickMate-Windows-Release
          path: build/windows/x64/runner/Release/

      - name: 6. Zip Release Folder (压缩编译产物)
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ClickMate-Windows.zip

      - name: 7. Create Release and Upload Asset (发布到Release并上传附件)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') 
        with:
          files: ClickMate-Windows.zip 
          generate_release_notes: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
